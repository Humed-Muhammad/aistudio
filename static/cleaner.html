<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio cleaner · Humed’s AI Studio</title>
<link rel="stylesheet" href="/static/tools.css"><script src="/static/tools.js"></script>
<style>
.ab { display: grid; gap: 12px; margin-top: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); }
.ab video { max-height: 420px; }
.ab .row .hint { margin-left: auto; }
.optgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.optgrid fieldset { margin-top: 22px; }
@media (max-width: 900px) { .optgrid { grid-template-columns: 1fr; } }
</style></head><body>
<div class="shell">
<aside class="rail" id="rail" data-active="cleaner" aria-label="Main"></aside>
<main class="main"><div class="page">
<div class="pagehead"><div><span class="eyebrow">Tool</span><h1>Audio cleaner</h1><p>Remove fans, hum, hiss and room noise from any recording, and get a transcript with subtitles. Your original file is never changed.</p></div></div>
<div class="app">
<aside class="side"><button type="button" class="secondary" onclick="newJob()">＋ New recording</button><span class="raillabel" style="margin-top:8px">Your recordings</span><div class="jobs" id="jobs"></div></aside>
<section>
<div class="notice" id="notice" hidden></div>

<form class="card" id="start">
 <label class="drop" id="drop"><input type="file" id="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.mp4,.mov,.m4v,.webm,.mkv" required><span class="icon">♪</span><strong id="file-name">Choose or drop a recording</strong><small id="file-sub">MP3, WAV, M4A, MP4, MOV… up to 60 minutes</small></label>
 <div class="optgrid">
  <fieldset><legend>1 · Noise removal</legend><div class="choices">
   <label class="choice"><input type="radio" name="noise" value="light" checked><b>Light <span class="tag">Free</span></b><small>On this Mac. Fans, hum, hiss and steady room noise.</small></label>
   <label class="choice"><input type="radio" name="noise" value="strong"><b>Strong <span class="tag paid">Paid</span></b><small>ElevenLabs. Also music, background voices and echo.</small></label>
   <label class="choice"><input type="radio" name="noise" value="off"><b>Off</b><small>Keep the sound as it is; only transcribe.</small></label>
  </div></fieldset>
  <fieldset><legend>2 · Transcript</legend>
   <label class="check" style="margin-top:0"><input type="checkbox" id="transcribe" checked> Write a transcript and subtitles (SRT)</label>
   <div id="lang-set" style="margin-top:12px"><div class="choices">
    <label class="choice"><input type="radio" name="language" value="am" checked><b>Amharic</b><small>Also Amharic mixed with English.</small></label>
    <label class="choice"><input type="radio" name="language" value="om"><b>Afaan Oromoo</b><small>Best effort, not officially supported.</small></label>
    <label class="choice"><input type="radio" name="language" value="en"><b>English</b><small>English only.</small></label>
    <label class="choice"><input type="radio" name="language" value="auto"><b>Detect</b><small>Oromo or English. Not for Amharic.</small></label>
   </div></div>
  </fieldset>
 </div>
 <div class="actions"><span class="costline" id="cost-hint"></span><button id="go">Start</button></div>
</form>

<div class="card" id="job" hidden>
 <div class="row between"><div><span class="eyebrow">Recording</span><h2 id="title"></h2></div><button type="button" class="ghost" id="delete">Delete</button></div>
 <div class="meta" id="meta"></div>
 <div class="stack" style="margin-top:16px">
  <div class="activity" id="activity" hidden><div class="spinner"></div><div><b id="act-msg"></b><small id="act-time"></small><div class="bar indeterminate"><i></i></div></div><button type="button" class="secondary small" id="cancel">Cancel</button></div>
  <div class="problem" id="problem" hidden><b>That didn't finish</b><span id="problem-msg"></span><div class="row" style="margin-top:12px"><button type="button" class="small" id="retry">Try again</button></div></div>
  <div class="done-msg" id="done" hidden></div>
 </div>
 <div id="results" hidden>
  <div class="ab" id="ab">
   <div class="row"><div class="segtabs" id="ab-tabs" role="tablist" aria-label="Listen to"></div><span class="hint" id="ab-hint"></span></div>
   <div id="ab-player"></div>
  </div>
  <div id="transcript-box" hidden>
   <div class="row between" style="margin-top:24px"><h3>Transcript</h3><div class="row"><a class="btn secondary small" id="srt" hidden>Subtitles (SRT) ↓</a><button type="button" class="secondary small" id="copy">Copy text</button></div></div>
   <div class="transcript" id="transcript" style="margin-top:10px"></div>
  </div>
  <h3 style="margin:24px 0 10px">Downloads</h3><div class="downloads" id="downloads"></div>
 </div>
</div>
</section></div></div></main></div>
<script>
const $=s=>document.querySelector(s);let jobs=[],jobId=null,job=null,poll=null,listPoll=null,side='clean';
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}e.append(...kids.flat().filter(k=>k!=null&&k!==false));return e}
async function api(url,options){const r=await fetch(url,options);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Something went wrong. Please try again.');return j}
function toast(msg){const n=$('#notice');n.hidden=!msg;n.textContent=msg||''}
function clock(s){s=Math.max(0,Math.round(s));return s<60?s+'s':Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'}
function ago(t){const d=new Date(t*1000);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}
function friendly(msg){if(/ELEVENLABS_API_KEY/.test(msg)&&!/Amharic/.test(msg))return 'ElevenLabs isn’t set up: add ELEVENLABS_API_KEY to the .env file and restart the app, or choose Light noise removal.';if(/make shorts|Install the renderer/.test(msg))return 'Local transcription isn’t installed yet: run make shorts once, or add ELEVENLABS_API_KEY to .env.';return msg}
const file=(n,dl)=>`/cleaner/jobs/${jobId}/files/${n}`+(dl?'?download=1':'');

async function loadJobs(){try{jobs=await api('/cleaner/jobs');drawJobs()}catch{}clearTimeout(listPoll);listPoll=setTimeout(loadJobs,jobs.some(j=>j.state==='running')?3000:20000)}
function drawJobs(){const list=$('#jobs');if(!jobs.length){list.replaceChildren(h('div',{class:'hint',style:'padding:6px 10px'},'Nothing yet. Cleaned recordings show up here.'));return}
 list.replaceChildren(...jobs.map(j=>h('button',{type:'button',class:'jobitem'+(j.id===jobId?' active':''),onclick:()=>openJob(j.id)},h('span',{class:'glyph'},j.video?'▶':'♪'),h('span',{},h('b',{},j.title),h('small',{},h('span',{class:'dot '+j.state}),j.state==='running'?'Working…':j.state==='error'?'Needs attention':j.state==='done'?'Ready':j.state==='cancelled'?'Stopped':'',' · ',ago(j.created))))))}

function openJob(id){jobId=id;job=null;side='clean';history.pushState(null,'','?job='+id);$('#start').hidden=true;$('#job').hidden=false;toast('');drawJobs();refresh()}
function newJob(){jobId=null;job=null;clearTimeout(poll);history.pushState(null,'','/cleaner');$('#job').hidden=true;$('#start').hidden=false;drawJobs()}
async function refresh(){if(!jobId)return;const id=jobId;try{const j=await api('/cleaner/jobs/'+id);if(id!==jobId)return;show(j);clearTimeout(poll);if(j.state==='running')poll=setTimeout(refresh,1500);else if(jobs.find(x=>x.id===id)?.state==='running')loadJobs()}catch(e){if(id!==jobId)return;if(/not found/i.test(e.message))newJob();else toast(e.message)}}

function show(j){const was=job;job=j;$('#title').textContent=j.title;
 const noise={light:'Light noise removal',strong:'Strong noise removal (ElevenLabs)',off:'No noise removal'}[j.noise],names={am:'Amharic',om:'Afaan Oromoo',en:'English'},lang=names[j.language]||'Detect language';
 const heard=j.detected&&j.detected!==j.language?'Detected: '+(names[j.detected]||j.detected):null;
 $('#meta').replaceChildren(...[j.name,j.duration?clock(j.duration):null,j.video?'Video':'Audio',noise,j.transcribe?'Transcript · '+lang:null,heard].filter(Boolean).map(t=>h('span',{},t)));
 const run=j.state==='running';$('#activity').hidden=!run;$('#act-msg').textContent=j.status||'Working';tick();
 $('#problem').hidden=!['error','cancelled'].includes(j.state);$('#problem-msg').textContent=friendly(j.status||'');$('#problem b').textContent=j.state==='cancelled'?'Stopped':'That didn’t finish';
 $('#done').hidden=j.state!=='done';$('#done').textContent='✓ '+(j.status||'Ready');
 $('#results').hidden=!j.outputs.length&&j.text==null;
 if(!was||was.id!==j.id||was.outputs.length!==j.outputs.length)drawMedia(j);
 $('#transcript-box').hidden=j.text==null;$('#transcript').textContent=j.text?.trim()||'No speech was found in this recording.';
 const srt=j.outputs.find(o=>o.file.endsWith('.srt'));$('#srt').hidden=!srt;if(srt)$('#srt').href=file(srt.file,true);
 $('#downloads').replaceChildren(...j.outputs.map(o=>h('a',{href:file(o.file,true)},o.label)),h('a',{href:file(j.input,true)},'Original (unchanged)'))}

// One player with an Original / Cleaned switch: switching keeps the playback position, so the difference is easy to hear.
function sources(j){const has=n=>j.outputs.some(o=>o.file===n),out={original:{src:file(j.input),video:j.video}};
 if(has('clean.mp3'))out.clean=has('clean-video.mp4')?{src:file('clean-video.mp4'),video:true}:{src:file('clean.mp3'),video:false};
 return out}
function drawMedia(j){const src=sources(j),both=!!src.clean;if(!src[side])side='original';
 $('#ab-tabs').hidden=!both;$('#ab-hint').textContent=both?'Switch while it plays: it keeps your place.':'';
 $('#ab-tabs').replaceChildren(...(both?[['original','Original'],['clean','Cleaned']]:[]).map(([k,label])=>h('button',{type:'button',role:'tab',class:k===side?'on':'','aria-selected':String(k===side),onclick:()=>listen(k)},label)));
 mount(src[side],0,false)}
function mount(s,at,play){const el=h(s.video?'video':'audio',{src:s.src,controls:true,preload:'metadata',playsinline:true});
 el.addEventListener('loadedmetadata',()=>{if(at)el.currentTime=Math.min(at,el.duration||at);if(play)el.play().catch(()=>{})},{once:true});
 $('#ab-player').replaceChildren(el)}
function listen(k){if(k===side||!job)return;const cur=$('#ab-player').firstChild,at=cur?.currentTime||0,play=cur&&!cur.paused;side=k;
 document.querySelectorAll('#ab-tabs button').forEach(b=>{const on=b.textContent===(k==='clean'?'Cleaned':'Original');b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on))});
 mount(sources(job)[k],at,play)}
function tick(){if(job?.state!=='running')return;const el=Date.now()/1000-(job.started||Date.now()/1000);$('#act-time').textContent=clock(el)+' elapsed'}
setInterval(tick,1000);

let setup={transcriber:'elevenlabs',elevenlabs:true};
function costHint(){const noise=document.querySelector('[name=noise]:checked').value,t=$('#transcribe').checked,lang=document.querySelector('[name=language]:checked').value;$('#lang-set').hidden=!t;
 const cloud=[noise==='strong'&&'noise removal',t&&setup.transcriber==='elevenlabs'&&'transcription'].filter(Boolean),warn=[];
 if(noise==='strong'&&!setup.elevenlabs)warn.push('Strong needs ELEVENLABS_API_KEY in .env.');
 if(t&&setup.transcriber==='whisper'&&['am','om'].includes(lang))warn.push((lang==='am'?'Amharic':'Oromo')+' transcripts need ELEVENLABS_API_KEY in .env.');
 const c=$('#cost-hint');c.className='costline'+(warn.length?' warn':cloud.length?' paid':'');
 c.textContent=warn.join(' ')||(cloud.length?'Paid per minute at ElevenLabs: '+cloud.join(' and ')+'. Everything else stays on this Mac.':'Free. Runs entirely on this Mac; nothing is uploaded.');
 $('#go').textContent=noise==='off'?'Transcribe':t?'Clean & transcribe':'Clean audio'}
document.querySelectorAll('[name=noise],[name=language],#transcribe').forEach(e=>e.onchange=costHint);costHint();api('/cleaner/setup').then(s=>{setup=s;costHint()}).catch(()=>{});
function picked(){const f=$('#file').files[0];$('#drop').classList.toggle('has',!!f);$('#file-name').textContent=f?.name||'Choose or drop a recording';$('#file-sub').textContent=f?(f.size/1048576).toFixed(1)+' MB · click to choose another':'MP3, WAV, M4A, MP4, MOV… up to 60 minutes'}
$('#file').onchange=picked;
['dragenter','dragover'].forEach(e=>$('#drop').addEventListener(e,()=>$('#drop').classList.add('over')));['dragleave','drop'].forEach(e=>$('#drop').addEventListener(e,()=>$('#drop').classList.remove('over')));
$('#start').onsubmit=async e=>{e.preventDefault();const f=$('#file').files[0];if(!f)return;
 const noise=document.querySelector('[name=noise]:checked').value,t=$('#transcribe').checked;if(noise==='off'&&!t){toast('Choose noise removal, a transcript, or both.');return}
 const d=new FormData();d.set('file',f);d.set('noise',noise);d.set('transcribe',t);d.set('language',document.querySelector('[name=language]:checked').value);
 $('#go').disabled=true;$('#go').textContent='Uploading…';toast('');
 try{const j=await api('/cleaner/jobs',{method:'POST',body:d});$('#start').reset();picked();await loadJobs();openJob(j.id)}catch(err){toast(err.message)}finally{$('#go').disabled=false;costHint()}};
$('#cancel').onclick=async()=>{try{show(await api(`/cleaner/jobs/${jobId}/cancel`,{method:'POST'}));refresh()}catch(e){toast(e.message)}};
$('#retry').onclick=async()=>{try{show(await api(`/cleaner/jobs/${jobId}/retry`,{method:'POST'}));refresh();loadJobs()}catch(e){toast(e.message)}};
$('#delete').onclick=async()=>{if(!confirm('Delete this recording and its results?'))return;try{await api('/cleaner/jobs/'+jobId,{method:'DELETE'});jobs=jobs.filter(j=>j.id!==jobId);newJob();loadJobs()}catch(e){toast(e.message)}};
$('#copy').onclick=async()=>{await navigator.clipboard.writeText(job.text||'');$('#copy').textContent='Copied';setTimeout(()=>$('#copy').textContent='Copy text',1500)};
window.onpopstate=()=>{const id=new URLSearchParams(location.search).get('job');id?openJob(id):newJob()};
loadJobs();{const id=new URLSearchParams(location.search).get('job');if(id)openJob(id)}
</script></body></html>
